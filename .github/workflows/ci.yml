name: Job Scheduler CI


on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build-and-test:

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:17

        env:
          POSTGRES_DB: job_scheduler
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d job_scheduler"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5


    env:

      DB_URL: jdbc:postgresql://localhost:5432/job_scheduler

      DB_USERNAME: postgres

      DB_PASSWORD: postgres


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Make Maven wrapper executable
        run: chmod +x mvnw


      - name: Show Java version
        run: java -version


      - name: Show Maven version
        run: ./mvnw -version


      - name: Run tests
        run: ./mvnw --batch-mode test


      - name: Build application
        run: ./mvnw --batch-mode package -DskipTests